[package]
name = "macpilot-desktop"
version = "0.1.0"
description = "MacPilot local-first agent desktop shell"
authors = ["MacPilot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
